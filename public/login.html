<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Budget Tracker</title>
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <div class="container">
        <!-- Authentication Section -->
        <div id="auth-section" class="section">
            <div class="login-container">
                <div class="login-header">
                    <h1>Budget Tracker</h1>
                    <p>Sign in to manage your expenses</p>
                </div>
                <form id="login-form" class="vertical-form">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required placeholder="Enter your email">
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required placeholder="Enter your password">
                    </div>
                    <button type="submit" class="login-button">Sign In</button>
                </form>
                <div class="or-divider">
                    <span>or</span>
                </div>
                <img id="google-signin" class="google-signin-image" src="img/google-signin-button-1024x260.png" alt="Sign in with Google" />
                <div class="links">
                    <a href="#" id="forgot-password">Forgot password?</a>
                    •
                    <a href="#" id="show-signup">Create account</a>
                </div>
            </div>
        </div>
    </div>

    <script src="js/login.js" type="module"></script>
</body>
</html>
