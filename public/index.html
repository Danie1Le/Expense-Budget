<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Budget App</title>
    <link rel="stylesheet" href="css/styles.css">
    <!-- Add Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <!-- Authentication Section -->
        <div id="auth-section" class="section">
            <h1>Expense Budget App</h1>
            <div id="auth-forms">
                <!-- Login Form -->
                <div id="login-form" class="auth-form">
                    <h2>Login</h2>
                    <form id="login">
                        <input type="email" id="login-email" placeholder="Email" required>
                        <input type="password" id="login-password" placeholder="Password" required>
                        <button type="submit">Login</button>
                    </form>
                    <button id="google-signin" class="google-btn">Sign in with Google</button>
                    <p>Don't have an account? <a href="#" id="show-signup">Sign up</a></p>
                </div>

                <!-- Signup Form -->
                <div id="signup-form" class="auth-form hidden">
                    <h2>Sign Up</h2>
                    <form id="signup">
                        <input type="email" id="signup-email" placeholder="Email" required>
                        <input type="password" id="signup-password" placeholder="Password" required>
                        <input type="password" id="signup-confirm-password" placeholder="Confirm Password" required>
                        <button type="submit">Sign Up</button>
                    </form>
                    <p>Already have an account? <a href="#" id="show-login">Login</a></p>
                </div>
            </div>
        </div>

        <!-- Main App Section (Hidden until authenticated) -->
        <div id="app-section" class="section hidden">
            <header>
                <h1>Welcome to Your Budget Dashboard</h1>
                <button id="logout-btn">Logout</button>
            </header>

            <!-- Budget Section -->
            <section id="budget-section">
                <h2>Monthly Budget</h2>
                <form id="budget-form">
                    <input type="number" id="budget-amount" placeholder="Set your monthly budget" required>
                    <button type="submit">Set Budget</button>
                </form>
                <div id="budget-display">
                    <p>Current Budget: <span id="current-budget">$0</span></p>
                    <p>Spent: <span id="total-spent">$0</span></p>
                    <p>Remaining: <span id="remaining-budget">$0</span></p>
                </div>
            </section>

            <!-- Add Expense Section -->
            <section id="add-expense-section">
                <h2>Add New Expense</h2>
                <form id="expense-form">
                    <input type="number" id="expense-amount" placeholder="Amount" required>
                    <input type="text" id="expense-category" placeholder="Category" required>
                    <input type="date" id="expense-date" required>
                    <button type="submit">Add Expense</button>
                </form>
            </section>

            <!-- Expense History Section -->
            <section id="expense-history-section">
                <h2>Expense History</h2>
                <div id="expense-list">
                    <!-- Expenses will be dynamically added here -->
                </div>
            </section>

            <!-- Expense Analytics Section -->
            <section id="expense-analytics-section" class="section">
                <h2>Expense Analytics</h2>
                <div class="chart-container">
                    <canvas id="categoryChart"></canvas>
                </div>
                <div class="chart-container">
                    <canvas id="trendChart"></canvas>
                </div>
            </section>
        </div>
    </div>

    <!-- Firebase App (the core Firebase SDK) -->
    <script src="https://www.gstatic.com/firebasejs/9.x.x/firebase-app.js"></script>
    <!-- Add Firebase products that you want to use -->
    <script src="https://www.gstatic.com/firebasejs/9.x.x/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.x.x/firebase-firestore.js"></script>
    
    <!-- Application Scripts -->
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/analytics.js" type="module"></script>
    <script src="js/app.js"></script>
</body>
</html>
